[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lime-camera"
version = "0.1.0"
description = "LIME: language-conditioned camera motion from a single RGB image"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13",
    "numpy>=2.0",
    "pillow>=11.0",
    "safetensors>=0.4",
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=4.57",
]

[project.optional-dependencies]
demo = [
    "lz4>=4.0",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "trimesh>=4.0",
    "viser>=1.0.24",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["lime_camera*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
